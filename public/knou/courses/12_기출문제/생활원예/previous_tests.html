<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Noto Sans KR", "Malgun Gothic", "맑은 고딕", sans-serif;
    background: #fff; color: #111; padding: 32px 40px 48px;
  }
  h1 {
    font-size: 2.2rem; font-weight: 900; color: #1f2a6b;
    text-shadow: 2px 2px 3px rgba(0,0,0,.25); margin-bottom: 28px;
    display: flex; align-items: center; gap: 14px;
  }
  h1 .mark { font-size: 1.7rem; }
  .card {
    max-width: 720px; border-radius: 22px; overflow: hidden;
    border: 2px solid #5a97c8; background: #d5e7f0;
    box-shadow: 4px 6px 10px rgba(0,0,0,.25);
  }
  .card h2 {
    background: #3e78ac; color: #fff; text-align: center;
    font-size: 1.8rem; font-weight: 900; padding: 14px 0;
    text-shadow: 1px 2px 3px rgba(0,0,0,.3);
  }
  .card ul { list-style: none; padding: 26px 0 30px; width: fit-content; margin: 0 auto; }
  .card li { font-size: 1.5rem; font-weight: 800; line-height: 1.9; position: relative; padding-left: 1.1em; }
  .card li::before { content: "•"; position: absolute; left: 0; }
  .card li a { color: #1f2a6b; text-decoration: none; }
  .card li a:hover { text-decoration: underline; color: #1f4fa8; }
  .card li .pdf { font-size: .6em; font-weight: 700; color: #1f4fa8; vertical-align: middle; margin-left: 6px; }
  @media (max-width: 700px) {
    body { padding: 20px; }
    h1 { font-size: 1.5rem; }
    .card h2 { font-size: 1.4rem; }
    .card li { font-size: 1.2rem; }
  }
</style>
